<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador Anti-Spam Villa Chichiriviche</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .card { background: #ffffff; border-radius: 16px; padding: 20px; max-width: 480px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { font-size: 1.25rem; color: #1e293b; margin-top: 0; text-align: center; }
    .preview { background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 14px; min-height: 160px; font-size: 0.95rem; line-height: 1.5; color: #334155; white-space: pre-wrap; margin-bottom: 16px; }
    .btn-group { display: flex; gap: 10px; }
    button { flex: 1; padding: 13px; font-size: 0.95rem; font-weight: 600; border-radius: 10px; border: none; cursor: pointer; transition: 0.2s; }
    .btn-generate { background-color: #0284c7; color: white; }
    .btn-generate:active { background-color: #0369a1; transform: scale(0.98); }
    .btn-copy { background-color: #10b981; color: white; }
    .btn-copy:active { background-color: #059669; transform: scale(0.98); }
    .alert { text-align: center; font-size: 0.82rem; color: #64748b; margin-top: 10px; }
  </style>
</head>
<body>

<div class="card">
  <h2>Generador de Respuestas</h2>
  <div class="preview" id="output">Presiona "Generar versión" para crear un mensaje nuevo.</div>
  
  <div class="btn-group">
    <button class="btn-generate" onclick="crearVariacion()">Generar versión</button>
    <button class="btn-copy" onclick="copiarTexto()">Copiar texto</button>
  </div>
  <div class="alert" id="status">Variaciones automáticas sin palabras bloqueadas ni símbolo $.</div>
</div>

<script>
  const saludos = [
    "¡Hola! Te comparto los detalles de la villa:",
    "¡Buenas! Con gusto te paso la información de disponibilidad y comodidades:",
    "¡Saludos! Claro que sí, aquí tienes lo que incluye la estadía:",
    "¡Hola! Qué tal, un gusto saludarte. Estos son los datos de la propiedad:"
  ];

  const ubicaciones = [
    "Estamos a dos calles del malecón y una del centro.",
    "Excelente ubicación: a 2 cuadras de la playa/malecón y a solo 1 cuadra de la zona central.",
    "Ubicada a pasos de todo: 2 cuadras del malecón y 1 del casco central de Chichiriviche.",
    "Punto céntrico: a 2 cuadras del malecón y a 1 cuadra del centro."
  ];

  const capacidades = [
    "Tiene capacidad cómoda para hasta 10 personas.",
    "Espacio ideal para grupos o familias de hasta 10 huéspedes.",
    "Recibe hasta un máximo de 10 personas.",
    "Apta para albergar hasta 10 integrantes."
  ];

  const distribuciones = [
    "Dispone de 3 habitaciones amplias, 1 baño completo, cocina con todos sus utensilios y piscina privada.",
    "Cuenta con 3 cuartos espaciosos, un baño completo, cocina equipada al 100% y su área de piscina.",
    "Incluye 3 dormitorios, baño completo, cocina lista para cocinar y piscina exclusiva para tu grupo.",
    "La casa tiene 3 habitaciones, 1 baño, cocina con electrodomésticos y zona de alberca."
  ];

  const extras = [
    "El Wi-Fi está incluido durante toda la estancia.",
    "Cuentan con servicio de internet Wi-Fi.",
    "Conectividad Wi-Fi disponible.",
    "Incluye conexión Wi-Fi sin costo adicional."
  ];

  const horarios = [
    "El horario de entrada es a las 3:00 PM y la salida a las 11:00 AM.",
    "Check-in: 3:00 PM | Check-out: 11:00 AM.",
    "Entrada a partir de las 3:00 PM y salida hasta las 11:00 AM.",
    "Manejamos ingreso a las 3:00 PM y retiro a las 11:00 AM."
  ];

  const tarifas = [
    "El valor por noche es de 150.",
    "La estancia está en 150 la noche.",
    "Costo por noche: 150.",
    "Queda en 150 por noche completa."
  ];

  const cierres = [
    "Si gustas asegurar fechas o consultar detalles, revisa el enlace directo en nuestro perfil.",
    "Para consultar disponibilidad de tus fechas, entra al enlace de nuestra bio.",
    "Cualquier consulta puntual o para agendar, puedes escribirnos por el link de la biografía.",
    "Si deseas coordinar tu llegada, déjanos un mensaje por el enlace del perfil."
  ];

  function randomItem(lista) {
    return lista[Math.floor(Math.random() * lista.length)];
  }

  function crearVariacion() {
    const estilo = Math.floor(Math.random() * 2);
    let texto = "";

    if (estilo === 0) {
      // Formato estructurado con viñetas
      texto = `${randomItem(saludos)}\n\n` +
              `📍 ${randomItem(ubicaciones)}\n` +
              `👥 ${randomItem(capacidades)}\n` +
              `🏠 ${randomItem(distribuciones)}\n` +
              `📶 ${randomItem(extras)}\n` +
              `⏰ ${randomItem(horarios)}\n` +
              `🏷️ ${randomItem(tarifas)}\n\n` +
              `${randomItem(cierres)}`;
    } else {
      // Formato narrativo natural (tipo conversación rápida)
      texto = `${randomItem(saludos)} ` +
              `${randomItem(ubicaciones)} ` +
              `${randomItem(capacidades)} ${randomItem(distribuciones)} ` +
              `${randomItem(extras)} ` +
              `El horario es de check-in 3:00 PM y check-out 11:00 AM. ` +
              `${randomItem(tarifas)} ` +
              `${randomItem(cierres)}`;
    }

    document.getElementById("output").innerText = texto;
    document.getElementById("status").innerText = "¡Nueva versión lista para copiar!";
  }

  function copiarTexto() {
    const contenido = document.getElementById("output").innerText;
    if (contenido.includes("Presiona")) return;
    
    navigator.clipboard.writeText(contenido).then(() => {
      document.getElementById("status").innerText = "✅ Mensaje copiado al portapapeles.";
      setTimeout(() => {
        document.getElementById("status").innerText = "Listo para enviar.";
      }, 2000);
    });
  }
</script>

</body>
</html>
