<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respuestas Villa Chichiriviche</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f0f4f8;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }
        h1 {
            font-size: 1.35rem;
            color: #0f766e;
            text-align: center;
            margin-bottom: 4px;
        }
        p.subtitle {
            font-size: 0.82rem;
            color: #64748b;
            text-align: center;
            margin-bottom: 16px;
        }
        .output-box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 16px;
            font-size: 0.94rem;
            line-height: 1.52;
            white-space: pre-line;
            color: #334155;
            min-height: 250px;
            margin-bottom: 16px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-generate {
            background-color: #0d9488;
            color: white;
        }
        .btn-generate:hover {
            background-color: #0f766e;
        }
        .btn-copy {
            background-color: #0284c7;
            color: white;
        }
        .btn-copy:hover {
            background-color: #0369a1;
        }
        .toast {
            text-align: center;
            font-size: 0.85rem;
            color: #059669;
            font-weight: 600;
            margin-top: 12px;
            height: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌴 Villa Chichiriviche</h1>
    <p class="subtitle">Generador anti-repetición (+2.4 millones de combinaciones)</p>

    <div id="mensaje" class="output-box"></div>

    <div class="btn-group">
        <button class="btn-generate" onclick="generarMensaje()">🔄 Generar nuevo mensaje único</button>
        <button class="btn-copy" onclick="copiarMensaje()">📋 Copiar respuesta</button>
    </div>

    <div id="toast" class="toast">✅ ¡Copiado al portapapeles!</div>
</div>

<script>
    // Historial para evitar que se repitan frases usadas recientemente
    const historial = {
        saludo: [],
        ubicacion: [],
        capacidad: [],
        amenidades: [],
        horario: [],
        precio: [],
        cierre: []
    };

    const saludos = [
        "¡Hola! Qué gusto saludarte.",
        "¡Hola! Bienvenido a Villa Chichiriviche.",
        "¡Saludos! Gracias por escribirnos.",
        "¡Hola! Qué alegría recibir tu mensaje.",
        "¡Hola! Con mucho gusto te comparto la información.",
        "¡Hola! Gracias por tu interés en nuestra casa.",
        "¡Saludos! Te cuento los detalles de nuestro alojamiento.",
        "¡Hola! Aquí tienes toda la información de la villa.",
        "¡Hola! Qué bueno saber de ti, te paso los datos:",
        "¡Hola! Es un placer atenderte."
    ];

    const ubicaciones = [
        "Nuestra casa es tu hospedaje ideal a pasos de todo: estamos a solo 2 cuadras del malecón y a 1 cuadra del centro.",
        "Disfruta de una estancia cómoda y relajante en una ubicación privilegiada, a 2 cuadras del malecón y 1 del centro.",
        "Estamos ubicados estratégicamente a pasos de todo (a 2 cuadras del malecón y a 1 cuadra del centro).",
        "Te ofrecemos un espacio cómodo para descansar, ubicado a solo 2 cuadras del malecón y a 1 cuadra del centro.",
        "La casa se encuentra a pasos de todo: apenas a 2 cuadras del malecón y a 1 cuadra del centro.",
        "Un hospedaje práctico y relajante, situado a 2 cuadras del malecón y a 1 cuadra del centro.",
        "Excelente ubicación para moverte caminando: a 2 cuadras del malecón y a 1 cuadra del centro.",
        "Alójate cerca de todo en nuestra casa, a solo 2 cuadras del malecón y 1 del centro."
    ];

    const capacidades = [
        "Capacidad para hasta 10 personas, con 3 amplias habitaciones y 1 baño completo.",
        "Espacio cómodo para grupos de hasta 10 huéspedes, distribuido en 3 habitaciones amplias y 1 baño completo.",
        "Cuenta con 3 amplias habitaciones y 1 baño completo, ideal para un máximo de 10 personas.",
        "Alojamiento hasta para 10 personas en 3 habitaciones espaciosas y 1 baño completo.",
        "Dispone de 3 habitaciones amplias, 1 baño completo y capacidad máxima para 10 personas.",
        "Pensada para familias o grupos de hasta 10 personas (3 habitaciones amplias + 1 baño completo).",
        "Tiene capacidad hasta para 10 huéspedes, ofreciendo 3 amplias habitaciones y 1 baño completo.",
        "Distribuida en 3 amplias habitaciones y 1 baño completo, recibiendo hasta 10 personas."
    ];

    const amenidades = [
        "Incluye área de piscina, conexión Wi-Fi y cocina totalmente equipada con electrodomésticos y utensilios.",
        "Disfruta de área de piscina, Wi-Fi incluido y cocina completamente equipada (utensilios y electrodomésticos).",
        "Tendrás acceso al área de piscina, Wi-Fi y una cocina equipada con todos sus electrodomésticos y utensilios.",
        "Ofrece área de piscina, Wi-Fi incluido y cocina totalmente equipada para preparar tus comidas.",
        "Equipada con cocina completa (electrodomésticos y utensilios), área de piscina y Wi-Fi incluido.",
        "Cuenta con área de piscina, conexión Wi-Fi y cocina totalmente equipada con utensilios y electrodomésticos.",
        "Para tu comodidad dispone de área de piscina, Wi-Fi y cocina equipada al 100%.",
        "Incluye Wi-Fi, área de piscina y cocina totalmente equipada (con electrodomésticos y utensilios)."
    ];

    const horarios = [
        "Horarios: Check-in (entrada) a las 3:00 PM y Check-out (salida) a las 11:00 AM.",
        "Entrada (Check-in): 3:00 PM | Salida (Check-out): 11:00 AM.",
        "Horario de estancia: ingreso desde las 3:00 PM y salida a las 11:00 AM.",
        "Check-in a partir de las 3:00 PM y Check-out a las 11:00 AM.",
        "El ingreso (Check-in) es a las 3:00 PM y la salida (Check-out) a las 11:00 AM.",
        "Horarios de estancia: entrada 3:00 PM / salida 11:00 AM.",
        "Tu estancia inicia a las 3:00 PM (Check-in) y finaliza a las 11:00 AM (Check-out)."
    ];

    const precios = [
        "La tarifa es de 150 por noche.",
        "Tarifa: 150 por noche.",
        "El valor por noche es de 150.",
        "Costo de alojamiento: 150 por noche.",
        "La estadía tiene una tarifa de 150 por noche.",
        "Maneja una tarifa de 150 por noche.",
        "Tarifa vigente: 150 por noche."
    ];

    const cierres = [
        "Si deseas consultar disponibilidad o realizar una reserva, ¡quedo a tu disposición!",
        "Cuéntame para qué fechas nos visitas y revisamos disponibilidad de inmediato.",
        "Escríbeme las fechas de tu viaje para confirmar disponibilidad y apartar tu estadía.",
        "Quedo atento a las fechas que buscas para verificar el calendario y ayudarte con tu reserva.",
        "¿Para qué días te gustaría reservar? Estoy por aquí para ayudarte con cualquier consulta.",
        "Dime qué fechas tienes pensadas y con gusto verifico disponibilidad para tu grupo.",
        "Estoy a tu orden para revisar disponibilidad o ayudarte a concretar tu reserva.",
        "Si quieres confirmar fechas disponibles o apartar la casa, escríbeme por aquí."
    ];

    const vinetas = ["•", "▸", "▪", "-", "✓", "🌴", "✨", "🏡"];

    function seleccionarSinRepetir(lista, clave) {
        const limiteMemoria = Math.floor(lista.length * 0.7);
        const disponibles = lista.filter(item => !historial[clave].includes(item));
        const pool = disponibles.length > 0 ? disponibles : lista;
        const elegido = pool[Math.floor(Math.random() * pool.length)];

        historial[clave].push(elegido);
        if (historial[clave].length > limiteMemoria) {
            historial[clave].shift();
        }
        return elegido;
    }

    function generarMensaje() {
        const s = seleccionarSinRepetir(saludos, "saludo");
        const u = seleccionarSinRepetir(ubicaciones, "ubicacion");
        const cap = seleccionarSinRepetir(capacidades, "capacidad");
        const am = seleccionarSinRepetir(amenidades, "amenidades");
        const hor = seleccionarSinRepetir(horarios, "horario");
        const pre = seleccionarSinRepetir(precios, "precio");
        const cie = seleccionarSinRepetir(cierres, "cierre");
        const v = vinetas[Math.floor(Math.random() * vinetas.length)];

        // Variación de estructura visual (3 formatos distintos)
        const formato = Math.floor(Math.random() * 3);
        let mensajeFinal = "";

        if (formato === 0) {
            mensajeFinal = `${s} ${u}\n\n${v} ${cap}\n${v} ${am}\n${v} ${hor}\n${v} ${pre}\n\n${cie}`;
        } else if (formato === 1) {
            mensajeFinal = `${s}\n\n${u}\n\nDetalles de la casa:\n${v} ${cap}\n${v} ${am}\n\n${hor} ${pre}\n\n${cie}`;
        } else {
            mensajeFinal = `${s} ${u}\n\n${cap} ${am}\n\n${v} ${hor}\n${v} ${pre}\n\n${cie}`;
        }

        document.getElementById("mensaje").textContent = mensajeFinal;
    }

    function copiarMensaje() {
        const texto = document.getElementById("mensaje").textContent;
        navigator.clipboard.writeText(texto).then(() => {
            const toast = document.getElementById("toast");
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 2000);
        });
    }

    window.onload = generarMensaje;
</script>

</body>
</html>
